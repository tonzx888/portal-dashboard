<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Operation Center</title>

    <link rel="stylesheet" href="login.css">
</head>

<body class="login-body">

    <main class="login-shell">
        <section class="login-card">

            <div class="login-brand">
                <div class="login-logo">OC</div>

                <div>
                    <p class="login-eyebrow">OPERATION CENTER</p>
                    <h1>Pusat Operasional</h1>
                    <p class="login-subtitle">
                        Masuk untuk mengakses data staff, cuti, offday, dan monitoring dokumen.
                    </p>
                </div>
            </div>

            <form id="loginForm" class="login-form">

                <div class="login-field">
                    <label for="username">Username</label>

                    <div class="login-input-wrap">
                        <span class="login-input-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span>

                        <input
                            type="text"
                            id="username"
                            placeholder="Masukkan username"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="login-field">
                    <label for="password">Password</label>

                    <div class="login-input-wrap">
                        <span class="login-input-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="login-toggle-password"
                            aria-label="Tampilkan password"
                        >
                            👁
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-submit">
                    <span>Masuk Dashboard</span>
                    <span class="login-submit-arrow">→</span>
                </button>

                <p id="pesanLogin" class="login-message"></p>
            </form>

            <div class="login-footer">
                <span class="login-status-dot"></span>
                <span>Secure HR Access</span>
            </div>

        </section>
    </main>

    <script src="login.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const toggleButton = document.getElementById("togglePassword");
            const passwordInput = document.getElementById("password");

            const eyeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
            const eyeOffIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a17.4 17.4 0 0 1-3.36 4.6M6.61 6.61A17.6 17.6 0 0 0 2 12s3.5 8 10 8a9.4 9.4 0 0 0 5.39-1.61"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="m2 2 20 20"/></svg>';

            toggleButton.innerHTML = eyeIcon;

            toggleButton?.addEventListener("click", () => {
                const isPassword = passwordInput.type === "password";

                passwordInput.type = isPassword ? "text" : "password";
                toggleButton.innerHTML = isPassword ? eyeOffIcon : eyeIcon;
                toggleButton.setAttribute(
                    "aria-label",
                    isPassword ? "Sembunyikan password" : "Tampilkan password"
                );
            });
        });
    </script>

</body>
</html>
